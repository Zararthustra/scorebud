<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScoreBud</title>
    <script>
      // Thème posé avant le rendu, sans éclair (spec 00 §6). Seule lecture du stockage hors de core/stockage.ts.
      (function () {
        var systeme = matchMedia('(prefers-color-scheme: dark)');
        function appliquer() {
          var theme;
          try {
            theme = JSON.parse(localStorage.getItem('scorebud:v2:prefs')).theme;
          } catch (e) {}
          document.documentElement.dataset.theme =
            theme === 'sombre' || (theme !== 'clair' && systeme.matches) ? 'dark' : 'light';
        }
        appliquer();
        systeme.addEventListener('change', appliquer);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
